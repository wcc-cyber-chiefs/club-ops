name: Deadline reminders

on:
  schedule:
    - cron: "7 15 * * *"   # daily, about 9:07 AM Central
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deadline-reminders
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Send deadline reminders
        run: python bots/reminders.py deadlines
        env:
          WEBHOOK_ANNOUNCEMENTS: ${{ secrets.WEBHOOK_ANNOUNCEMENTS }}
          WEBHOOK_JOBS: ${{ secrets.WEBHOOK_JOBS }}
          WEBHOOK_EVENTS: ${{ secrets.WEBHOOK_EVENTS }}
          WEBHOOK_NCL: ${{ secrets.WEBHOOK_NCL }}
          WEBHOOK_SKILLSUSA: ${{ secrets.WEBHOOK_SKILLSUSA }}
      - name: Save state
        run: bash bots/commit_state.sh
      - name: Alert officers on failure
        if: failure()
        run: python bots/notify_failure.py
        env:
          WEBHOOK_MODS: ${{ secrets.WEBHOOK_MODS }}
