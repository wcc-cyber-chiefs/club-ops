name: Session reminders

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes; GitHub may start runs a few minutes late
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: session-reminders
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Send session reminders
        run: python bots/reminders.py sessions
        env:
          WEBHOOK_ANNOUNCEMENTS: ${{ secrets.WEBHOOK_ANNOUNCEMENTS }}
      - name: Save state
        run: bash bots/commit_state.sh
      - name: Alert officers on failure
        if: failure()
        run: python bots/notify_failure.py
        env:
          WEBHOOK_MODS: ${{ secrets.WEBHOOK_MODS }}
