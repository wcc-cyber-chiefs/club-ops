name: CTF radar

on:
  schedule:
    - cron: "37 14 * * 1"   # Mondays, about 8:37 AM Central
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ctf-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml
      - name: Post upcoming CTFs
        run: python bots/ctf_radar.py
        env:
          WEBHOOK_EVENTS: ${{ secrets.WEBHOOK_EVENTS }}
      - name: Save state (weekly heartbeat)
        run: bash bots/commit_state.sh
      - name: Alert officers on failure
        if: failure()
        run: python bots/notify_failure.py
        env:
          WEBHOOK_MODS: ${{ secrets.WEBHOOK_MODS }}
