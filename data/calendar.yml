# Deadlines and dates the bots remind people about.
#
# Each entry is posted at 14, 3 and 1 days before `date` unless you set
# remind_days. Add things by pull request; the validate check catches typos.
#
# Fields:
#   id          short unique slug, never change it after it has posted
#   title       what people see
#   date        YYYY-MM-DD (the deadline or event day)
#   channel     announcements | ncl | skills-usa | events | jobs
#   role        optional ping role key from discord.yml (ncl, skills-usa, ctf, opportunities, sessions)
#   url         where to sign up or read more
#   notes       one line of context
#   remind_days optional list, e.g. [7, 1]

items: []

